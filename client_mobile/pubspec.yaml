name: pintig_edge
description: "The Heartbeat of Last-Mile Healthcare - Edge Client"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Encrypted Local Relational Database
  drift: ^2.20.0
  drift_sqflite: ^2.0.0
  sqlite3_flutter_libs: ^0.5.24

  # Keystore Key Derivation
  flutter_secure_storage: ^9.2.2

  # Background Scheduling
  workmanager: ^0.10.10

  # Network & Preferences (Required by Sprint 3)
  http: ^1.2.2
  shared_preferences: ^2.3.2

  # Utilities
  uuid: ^4.4.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Drift Code Generation
  drift_dev: ^2.20.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
