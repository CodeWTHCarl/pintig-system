name: pintig_edge
description: "Pintig: The Heartbeat of Last-Mile Healthcare"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Encrypted Local Relational Database
  drift: ^2.20.0
  drift_sqflite: ^2.0.0
  sqlite3_flutter_libs: ^0.5.24

  # Keystore Key Derivation
  flutter_secure_storage: ^9.2.2

  # Background Scheduling
  workmanager: ^0.10.10

  # Network & Preferences (Required by Sprint 3)
  http: ^1.2.2
  shared_preferences: ^2.3.2

  # Utilities
  uuid: ^4.4.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Drift Code Generation
  drift_dev: ^2.20.0
  build_runner: ^2.4.11

  # App Launcher Icon Generator
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/pintig_logo.png"
  adaptive_icon_background: "#FAF8F5"
  adaptive_icon_foreground: "assets/pintig_logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/pintig_logo.png
